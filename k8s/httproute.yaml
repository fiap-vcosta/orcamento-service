apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orcamento-service
  namespace: tech-challenge
spec:
  parentRefs:
    - name: public
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orcamento
      backendRefs:
        - name: orcamento-service
          port: 80
