apiVersion: apps/v1
kind: Deployment
metadata:
  name: orcamento-service
  namespace: tech-challenge
  labels:
    app: orcamento-service
    tags.datadoghq.com/service: orcamento-service
    tags.datadoghq.com/env: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orcamento-service
  template:
    metadata:
      labels:
        app: orcamento-service
        tags.datadoghq.com/service: orcamento-service
        tags.datadoghq.com/env: prod
    spec:
      serviceAccountName: orcamento-service
      containers:
        - name: orcamento-service
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: orcamento-service
            - secretRef:
                name: orcamento-service
          env:
            - name: DD_VERSION
              value: "${DD_VERSION}"
          startupProbe:
            httpGet:
              path: /orcamento/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /orcamento/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /orcamento/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "768Mi"
              ephemeral-storage: "256Mi"
        - name: datadog-agent
          image: gcr.io/datadoghq/agent:7.68.3
          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: orcamento-service
                  key: DD_API_KEY
            - name: DD_SITE
              valueFrom:
                configMapKeyRef:
                  name: orcamento-service
                  key: DD_SITE
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_APM_NON_LOCAL_TRAFFIC
              value: "false"
            - name: DD_DOGSTATSD_NON_LOCAL_TRAFFIC
              value: "false"
            - name: DD_LOGS_ENABLED
              value: "false"
            - name: DD_PROCESS_AGENT_ENABLED
              value: "false"
            - name: DD_SYSTEM_PROBE_ENABLED
              value: "false"
            - name: DD_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DD_CONTAINER_EXCLUDE
              value: "name:.*"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "512Mi"
              ephemeral-storage: "256Mi"
